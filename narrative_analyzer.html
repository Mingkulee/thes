<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ AI 내러티브 분석기 (Web UI)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fa;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #3498db;
            text-align: center;
            margin-bottom: 15px;
        }
        p {
             text-align: center;
             color: #666;
             margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        #input-text {
            width: calc(100% - 20px);
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            min-height: 150px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        #input-text:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        #analyzeButton {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.3s ease;
        }

        #analyzeButton:hover {
            background-color: #27ad60;
        }

        #result-container {
            margin-top: 40px;
            padding: 25px;
            border: 1px solid #ddd;
            background-color: #f9f9fb;
            border-radius: 10px;
        }

        .analysis-section {
            margin-bottom: 25px;
            padding: 18px;
            border-left: 6px solid;
            background-color: #ffffff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
        }

        #step1 { border-left-color: #e74c3c; background-color: #fdeeed; }
        #step2 { border-left-color: #f39c12; background-color: #fffbe6; }
        #step3 { border-left-color: #3498db; background-color: #eaf5ff; }

        .analysis-section h3 {
            margin-top: 0;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ AI 내러티브 분석기</h1>
    <p>텍스트를 입력하고 버튼을 누르면, '감지 → 분석 → 추론'의 3단계 구조로 결과를 확인합니다.</p>

    <div>
        <label for="input-text">🔎 분석할 텍스트를 여기에 붙여넣거나 직접 작성해주세요:</label>
        <textarea id="input-text" placeholder="예시: '민준 씨는 북촌 한옥마을에서 힘든 시간을 이겨내고, 마침내 꿈에 그리던 프로젝트를 성공적으로 끝냈다.'"></textarea>
    </div>

    <button id="analyzeButton" onclick="analyzeText()">✨ 구조 분석 시작</button>

    <div id="result-container">
        <h2>📊 분석 결과</h2>
        <p style="color: #888;">버튼을 눌러 분석을 실행하면 여기에 단계별 결과가 나타납니다.</p>
    </div>
</div>

<script>
async function analyzeText() {
    const inputText = document.getElementById('input-text').value.trim();
    const resultContainer = document.getElementById('result-container');

    if (!inputText) {
        alert("분석할 텍스트를 입력해주세요.");
        return;
    }

    document.getElementById('analyzeButton').disabled = true;
    document.getElementById('analyzeButton').textContent = '✨ AI가 분석 중... 잠시만 기다려주세요.';
    resultContainer.innerHTML = '<h2 style="color: #3498db;">📊 분석 결과</h2><p style="text-align: center;">🧠 AI 모델과 통신하며 지능적인 구조를 분석하고 있습니다...</p>';

    // ==============================================================
    // 🚨 [필수 수정] 백엔드 서버 API 엔드포인트로 변경
    const API_ENDPOINT = "YOUR_API_ENDPOINT";
    // ==============================================================

    try {
        const response = await fetch(API_ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer YOUR_API_KEY'
            },
            body: JSON.stringify({
                text: inputText,
                task: "narrative_analysis"
            })
        });

        if (!response.ok) {
            throw new Error('API 호출 실패: HTTP 상태 코드 ' + response.status);
        }

        const data = await response.json();
        displayResults(data);

    } catch (error) {
        console.error("분석 중 오류 발생:", error);
        resultContainer.innerHTML =
            '<h2 style="color: red;">❌ 분석 실패</h2>' +
            '<p>데이터 통신에 문제가 발생했습니다. 다음을 확인해주세요:</p>' +
            '<ul>' +
            '<li>API 엔드포인트 주소가 정확한가요?</li>' +
            '<li>CORS 문제나 API 키 인증 오류는 아닌가요? (브라우저 콘솔 [Console] 확인 권장)</li>' +
            '</ul>' +
            '<p>오류 메시지: ' + error.message + '</p>';
    } finally {
        document.getElementById('analyzeButton').disabled = false;
        document.getElementById('analyzeButton').textContent = '✨ 구조 분석 시작';
    }
}

function displayResults(resultData) {
    const analysis = resultData;
    const resultContainer = document.getElementById('result-container');

    resultContainer.innerHTML =
        '<h2 style="color: #3498db;">📊 분석 결과</h2>' +

        '<div class="analysis-section" id="step1">' +
        '<h3>🔍 1단계: 핵심 요소 감지 (Elements Detected)</h3>' +
        '<p><strong>감지된 캐릭터/장소:</strong> ' + (analysis.detected_elements || '정보가 없습니다.') + '</p>' +
        '<p><strong>주요 사건:</strong> ' + (analysis.main_events || '관련 주요 행동 흐름이 감지되지 않았습니다.') + '</p>' +
        '</div>' +

        '<div class="analysis-section" id="step2">' +
        '<h3>📊 2단계: 플롯 및 전환점 분석 (Plot & Turning Points)</h3>' +
        '<p>' + (analysis.structure_summary || '분석된 구조에 대한 종합 요약입니다.') + '</p>' +
        '</div>' +

        '<div class="analysis-section" id="step3">' +
        '<h3>💡 3단계: 잠재적 의미 및 결말 추론</h3>' +
        '<p>' + (analysis.inference || '이 이야기의 잠재적인 메시지나 결말에 대한 추론입니다.') + '</p>' +
        '</div>';
}
</script>

</body>
</html>
